<!DOCTYPE html>
<html>

<body>
    <div>Mezolit character example</div>
    <table>
        <tbody>

        </tbody>
    </table>
    <style>
        body {
            overflow: visible;
        }

        div {
            width: 100%;
            text-align: center;

        }

        table {
            width: 100%;
        }
    </style>
    <script>
        const attributes = {
            Hunting: 5,
            Making: 2,
            Life: 4,
            Cunning: 3,
            Song: 4,
            Anima: 5
        };

        const elem = (parent, name, value, setup) => {
            const ret = document.createElement(name);
            parent.appendChild(ret);
            if (typeof value === 'string') {
                ret.innerText = value;
            }
            setup?.(ret);
        }

        const tbody = document.querySelector('tbody');
        Object.entries(attributes).forEach(([name, value]) => {
            elem(tbody, 'tr', null, tr => {
                elem(tr, 'td', name);
                elem(tr, 'td', String(value));
                elem(tr, 'td', null, td => {
                    elem(td, 'button', 'Roll', button => {
                        button.addEventListener('click', () => {
                            window.parent?.postMessage(`${name} check: ${value}D`, '*');
                        });
                    })
                })
            });
        });


    </script>
</body>

</html>
