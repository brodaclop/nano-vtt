<!DOCTYPE html>
<html>

<body>
    <nav></nav>
    <table>
        <tbody>

        </tbody>
    </table>
    <style>
        body {
            overflow: visible;
        }

        div {
            width: 100%;
            text-align: center;
        }

        nav {
            position: sticky;
            top: 0;
        }

        ul {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            width: 100%;
            list-style: none;
        }


        table {
            width: 100%;
        }

        input[type=number] {
            width: 2em;
        }

        textarea {
            width: 100%;
            height: 10em;
        }
    </style>
    <script>
        const charString = localStorage.getItem('character');

        const character = charString ? JSON.parse(charString) : {
            name: '',
            attributes: {
                Hunting: { max: 1, val: 1 },
                Making: { max: 1, val: 1 },
                Life: { max: 1, val: 1 },
                Cunning: { max: 1, val: 1 },
                Song: { max: 1, val: 1 },
                Anima: { max: 1, val: 1 }
            },
            backstory: '',
            notes: '',
            equipment: '',
            songs: '',
        };

        const bind = (input, parent, property) => {
            const type = typeof parent[property];
            input.value = parent[property];
            input.addEventListener('change', () => {
                parent[property] = type === 'number' ? Number(input.value) : input.value;
                save();
            });
        }

        const save = () => localStorage.setItem('character', JSON.stringify(character));

        save();

        const elem = (parent, name, value, setup) => {
            const ret = document.createElement(name);
            parent.appendChild(ret);
            if (typeof value === 'string') {
                ret.innerText = value;
            }
            setup?.(ret);
        };

        const textSection = (title, field) => {
            elem(tbody, 'tr', null, tr => {
                elem(tr, 'th', title, th => {
                    th.colSpan = 3;
                    th.id = `section-${title}`
                });
            });
            elem(tbody, 'tr', null, tr => {
                elem(tr, 'td', null, td => {
                    td.colSpan = 3;
                    elem(td, 'textarea', character[field], text => {
                        bind(text, character, field);
                    });
                });
            });
        };

        const tbody = document.querySelector('tbody');
        const nav = document.querySelector('nav');
        elem(tbody, 'tr', null, tr => {
            elem(tr, 'th', 'Name');
            elem(tr, 'td', null, td => {
                td.colSpan = 2;
                td.id = 'section-Character';
                elem(td, 'input', null, input => {
                    input.type = 'text';
                    bind(input, character, 'name');
                })

            })
        });
        Object.entries(character.attributes).forEach(([name, value]) => {
            elem(tbody, 'tr', null, tr => {
                elem(tr, 'th', name);
                elem(tr, 'td', null, td => {
                    elem(td, 'input', null, input => {
                        input.type = 'number';
                        bind(input, value, 'val');
                    })
                    td.appendChild(document.createTextNode('/'));
                    elem(td, 'input', null, input => {
                        input.type = 'number';
                        bind(input, value, 'max');
                    })
                });
                elem(tr, 'td', null, td => {
                    elem(td, 'button', 'Roll', button => {
                        button.addEventListener('click', () => {
                            window.parent?.postMessage(`${name} check: ${value.val}D`, '*');
                        });
                    })
                })
            });
        });
        elem(tbody, 'tr', null, tr => {
            elem(tr, 'th', 'Rolls', th => {
                th.colSpan = 3;
                th.id = `section-Rolls`
            });
        });
        elem(tbody, 'tr', null, tr => {
            elem(tr, 'td', null, td => {
                td.colSpan = 3;
                elem(td, 'ul', null, ul => {
                    Array(15).fill(null).forEach((_, i) => elem(ul, 'li', null, li => elem(td, 'button', String(i + 1), button => {
                        button.addEventListener('click', () => {
                            window.parent?.postMessage(`Roll: ${i + 1}D`, '*');
                        });
                    })));
                });
            });
        });

        textSection('Equipment', 'equipment');
        textSection('Songs', 'songs');
        textSection('Notes', 'notes');
        textSection('Backstory', 'backstory');

        elem(nav, 'ul', null, ul => {
            ['Character', 'Rolls', 'Equipment', 'Songs', 'Notes', 'Backstory'].forEach(title => {
                elem(ul, 'li', null, li => {
                    elem(li, 'button', title, button => {
                        button.addEventListener('click', () => document.querySelector(`#section-${title}`)?.scrollIntoView({ behavior: "smooth" }));
                    })
                });
            });
        });

    </script>

    <style>
    </style>
</body>

</html>
